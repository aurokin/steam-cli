[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steam-agent"
version = "0.1.0"
description = "A local-first Steam evidence and operations CLI for agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.6,<26",
    "psutil>=7.0,<8",
    "pywin32>=311,<312; sys_platform == 'win32'",
]

[project.scripts]
steam-agent = "steam_agent.__main__:main"
steam-agent-broker = "steam_agent.execution.broker_main:main"

[tool.hatch.build.targets.wheel.force-include]
"schemas/response.schema.json" = "steam_agent/schemas/response.schema.json"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.12,<1",
]
